name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    name: Run Python Tests & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          python -m py_compile models.py SystheticDataGenerationPatient.py demo/convert_csv_to_json.py demo/server.py

      - name: Test CSV to JSON Conversion
        run: |
          python demo/convert_csv_to_json.py

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v
